<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Episode Stream Bot</title>

    <!-- Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Monetag Rewarded Interstitial -->
    <script
        src="//libtl.com/sdk.js"
        data-zone="11645093"
        data-sdk="show_11645093">
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 12px;
            background: #0b0b0b;
            color: white;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
        }

        .header-title {
            font-size: 17px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 15px;
        }

        .card {
            background: #141414;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .card:active {
            background: #1f1f1f;
        }

        .card.disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .left-side {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .num-box {
            width: 45px;
            height: 45px;
            background: linear-gradient(
                135deg,
                #cc0000 0%,
                #660000 100%
            );
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .ep-info h3 {
            margin: 0 0 4px 0;
            font-size: 16px;
            font-weight: 600;
        }

        .ep-info p {
            margin: 0;
            font-size: 13px;
            color: #888;
        }

        .arrow {
            color: #777;
            font-size: 20px;
        }

        .back-btn {
            color: #ff4757;
            font-size: 14px;
            margin-bottom: 15px;
            cursor: pointer;
            font-weight: 500;
        }

        .quality-card {
            background: #141414;
            border: 1px solid #222;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .quality-card:active {
            background: #1f1f1f;
        }

        .q-text {
            font-size: 16px;
            font-weight: 600;
        }

        .get-file {
            color: #ff3b30;
            font-size: 14px;
            font-weight: 600;
        }

        .loading-screen,
        .success-screen,
        .error-screen {
            text-align: center;
            padding-top: 60px;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: #20c65a;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .error-icon {
            width: 80px;
            height: 80px;
            background: #d93025;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .action-button {
            width: 100%;
            background: #ff2d2d;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 25px;
            cursor: pointer;
        }

        .action-button:active {
            opacity: 0.8;
        }
    </style>
</head>

<body>

<div id="app"></div>

<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

let selectedEpisode = null;
let selectedQuality = null;

const totalEpisodes = 8;


/* =========================
   EPISODE LIST
========================= */

function showEpisodes() {

    let html = `
        <div class="header-title">
            Episode Stream Bot
        </div>
    `;

    for (let i = 1; i <= totalEpisodes; i++) {

        if (i <= 2) {

            html += `
                <div
                    class="card"
                    onclick="selectEpisode(${i})"
                >

                    <div class="left-side">

                        <div class="num-box">
                            ${i}
                        </div>

                        <div class="ep-info">

                            <h3>
                                Episode ${i}
                            </h3>

                            <p>
                                1080p · 720p · 480p
                            </p>

                        </div>

                    </div>

                    <div class="arrow">
                        ›
                    </div>

                </div>
            `;

        } else {

            html += `
                <div class="card disabled">

                    <div class="left-side">

                        <div
                            class="num-box"
                            style="background:#333;"
                        >
                            ${i}
                        </div>

                        <div class="ep-info">

                            <h3>
                                Episode ${i}
                            </h3>

                            <p
                                style="
                                    color:#ff4757;
                                    font-weight:500;
                                "
                            >
                                Coming Soon
                            </p>

                        </div>

                    </div>

                </div>
            `;
        }
    }

    document.getElementById("app").innerHTML = html;
}


/* =========================
   SELECT EPISODE
========================= */

function selectEpisode(ep) {

    selectedEpisode = ep;

    document.getElementById("app").innerHTML = `

        <div
            class="back-btn"
            onclick="showEpisodes()"
        >
            ❮ Episode ${ep}
        </div>

        <div
            class="header-title"
            style="
                text-align:left;
                font-size:18px;
            "
        >
            Episode ${ep}
        </div>

        <p
            style="
                color:#888;
                font-size:13px;
                margin-top:-10px;
                margin-bottom:20px;
            "
        >
            Episode Stream
        </p>


        <div
            class="quality-card"
            onclick="startAd('1080p')"
        >

            <div class="q-text">
                1080p
            </div>

            <div class="get-file">
                ▶ GET FILE
            </div>

        </div>


        <div
            class="quality-card"
            onclick="startAd('720p')"
        >

            <div class="q-text">
                720p
            </div>

            <div class="get-file">
                ▶ GET FILE
            </div>

        </div>


        <div
            class="quality-card"
            onclick="startAd('480p')"
        >

            <div class="q-text">
                480p
            </div>

            <div class="get-file">
                ▶ GET FILE
            </div>

        </div>


        <p
            style="
                text-align:center;
                color:#777;
                font-size:12px;
                margin-top:30px;
            "
        >
            Watch a short ad to unlock the file.
        </p>
    `;
}


/* =========================
   START MONETAG AD
========================= */

function startAd(quality) {

    selectedQuality = quality;

    document.getElementById("app").innerHTML = `

        <div class="loading-screen">

            <h2>
                ⏳ Loading Ad...
            </h2>

            <p style="color:#888;">
                Please wait while the ad loads.
            </p>

        </div>
    `;


    /* Monetag SDK check */

    if (typeof show_11645093 !== "function") {

        showAdError(
            "Advertisement is not available right now."
        );

        return;
    }


    /*
       IMPORTANT:

       Success  = unlock
       Error    = DO NOT unlock
    */

    try {

        show_11645093()
            .then(function() {

                console.log(
                    "Monetag ad completed"
                );

                showSuccessScreen();

            })
            .catch(function(error) {

                console.log(
                    "Monetag ad failed:",
                    error
                );

                showAdError(
                    "Please watch the advertisement completely and try again."
                );

            });

    } catch (error) {

        console.log(
            "Monetag exception:",
            error
        );

        showAdError(
            "Advertisement could not be loaded."
        );
    }
}


/* =========================
   AD ERROR
========================= */

function showAdError(message) {

    document.getElementById("app").innerHTML = `

        <div class="error-screen">

            <div class="error-icon">
                ✕
            </div>

            <h2>
                Ad Not Completed
            </h2>

            <p
                style="
                    color:#888;
                    font-size:14px;
                "
            >
                ${message}
            </p>

            <button
                class="action-button"
                onclick="selectEpisode(${selectedEpisode})"
            >
                Try Again
            </button>

        </div>
    `;
}


/* =========================
   SUCCESS SCREEN
========================= */

function showSuccessScreen() {

    document.getElementById("app").innerHTML = `

        <div class="success-screen">

            <div class="success-icon">
                ✓
            </div>

            <h2
                style="margin-bottom:5px;"
            >
                File coming!
            </h2>

            <p
                style="
                    color:#aaa;
                    font-size:14px;
                    margin-top:0;
                "
            >
                Episode ${selectedEpisode}
                · ${selectedQuality}
            </p>

            <p
                style="
                    color:#666;
                    font-size:13px;
                    margin-top:20px;
                "
            >
                The file will arrive in your chat.
            </p>


            <button
                class="action-button"
                onclick="sendDataToBot()"
            >
                Open Bot to Collect
            </button>

        </div>
    `;
}


/* =========================
   SEND DATA TO TELEGRAM BOT
========================= */

function sendDataToBot() {

    const payload = {

        action: "collect_file",

        episode: selectedEpisode,

        quality: selectedQuality,

        timestamp: Date.now()

    };


    console.log(
        "Sending to bot:",
        payload
    );


    tg.sendData(
        JSON.stringify(payload)
    );
}


/* =========================
   START APP
========================= */

showEpisodes();

</script>

</body>
    </html>
