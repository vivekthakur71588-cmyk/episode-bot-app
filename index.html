<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>India's Got Latent - Episodes</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
        }
        h2 {
            text-align: center;
            color: #ff4757;
            margin-bottom: 20px;
        }
        .episode-card {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #333;
            cursor: pointer;
        }
        .ep-details h4 {
            margin: 0 0 5px 0;
            font-size: 16px;
        }
        .ep-details p {
            margin: 0;
            font-size: 12px;
            color: #888;
        }
        .quality-box {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            border: 1px solid #333;
            cursor: pointer;
        }
        .quality-box:active {
            background: #2a2a2a;
        }
    </style>
</head>
<body>

    <div id="main-page">
        <h2>🎬 India's Got Latent</h2>

        <!-- Episode 1 -->
        <div class="episode-card" onclick="showQualityPage(1)">
            <div class="ep-details">
                <h4>Episode 1</h4>
                <p>Select Quality ➔</p>
            </div>
        </div>

        <!-- Episode 2 -->
        <div class="episode-card" onclick="showQualityPage(2)">
            <div class="ep-details">
                <h4>Episode 2</h4>
                <p>Select Quality ➔</p>
            </div>
        </div>

        <!-- Episode 3 (Coming Soon) -->
        <div class="episode-card" style="opacity: 0.5; cursor: not-allowed;">
            <div class="ep-details">
                <h4>Episode 3 <span style="font-size: 10px; background: #d32f2f; color: white; padding: 2px 5px; border-radius: 3px;">SOON</span></h4>
                <p>Releasing soon... 🔒</p>
            </div>
        </div>
    </div>

    <div id="quality-page" style="display: none;">
        <h3 id="ep-title" style="text-align: center; color: #ff4757;">Select Quality</h3>
        <p onclick="showMainPage()" style="color: #ff4757; cursor: pointer; margin-bottom: 20px;">⬅️ Back to Episodes</p>
        
        <div class="quality-box" onclick="sendDataToBot('1080p Full HD')">
            <div style="background: #2ed573; padding: 10px; border-radius: 8px; margin-right: 15px; font-weight: bold;">HD</div>
            <div>
                <h4 style="margin:0;">1080p Full HD</h4>
                <p style="margin:0; font-size:12px; color:#888;">High Quality Video</p>
            </div>
        </div>

        <div class="quality-box" onclick="sendDataToBot('720p HD')">
            <div style="background: #1e90ff; padding: 10px; border-radius: 8px; margin-right: 15px; font-weight: bold;">HQ</div>
            <div>
                <h4 style="margin:0;">720p HD</h4>
                <p style="margin:0; font-size:12px; color:#888;">Standard Quality</p>
            </div>
        </div>

        <div class="quality-box" onclick="sendDataToBot('480p SD')">
            <div style="background: #ffa502; padding: 10px; border-radius: 8px; margin-right: 15px; font-weight: bold;">SD</div>
            <div>
                <h4 style="margin:0;">480p SD</h4>
                <p style="margin:0; font-size:12px; color:#888;">Low Data Usage</p>
            </div>
        </div>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        let selectedEpisode = 1;

        function showQualityPage(epNum) {
            selectedEpisode = epNum;
            document.getElementById('main-page').style.display = 'none';
            document.getElementById('quality-page').style.display = 'block';
            document.getElementById('ep-title').innerText = `Episode ${epNum} - Select Quality`;
        }

        function showMainPage() {
            document.getElementById('quality-page').style.display = 'none';
            document.getElementById('main-page').style.display = 'block';
        }

        function sendDataToBot(qualityStr) {
            const payload = JSON.stringify({
                episode: selectedEpisode,
                quality: qualityStr
            });

            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.sendData(payload); // Bot ko data bhejega aur app band hogi
            } else {
                alert("Please open inside Telegram!");
            }
        }
    </script>

</body>
    </html>
