<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>India's Got Latent - Episodes</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
        }
        h2 {
            text-align: center;
            color: #ff4757;
            margin-bottom: 20px;
        }
        .episode-card {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #333;
        }
        .ep-details h4 {
            margin: 0 0 5px 0;
            font-size: 16px;
        }
        .ep-details p {
            margin: 0;
            font-size: 12px;
            color: #888;
        }
        .btn-group {
            display: flex;
            gap: 5px;
        }
        .quality-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }
        .quality-btn:active {
            background: #ff6b81;
        }
    </style>
</head>
<body>

    <h2>🎬 India's Got Latent</h2>

    <!-- Episode 1 -->
    <div class="episode-card">
        <div class="ep-details">
            <h4>Episode 1</h4>
            <p>1080p • 720p • 480p</p>
        </div>
        <div class="btn-group">
            <button class="quality-btn" onclick="selectQuality(1, '1080p')">1080p</button>
            <button class="quality-btn" onclick="selectQuality(1, '720p')">720p</button>
            <button class="quality-btn" onclick="selectQuality(1, '480p')">480p</button>
        </div>
    </div>

    <!-- Episode 2 -->
    <div class="episode-card">
        <div class="ep-details">
            <h4>Episode 2</h4>
            <p>1080p • 720p • 480p</p>
        </div>
        <div class="btn-group">
            <button class="quality-btn" onclick="selectQuality(2, '1080p')">1080p</button>
            <button class="quality-btn" onclick="selectQuality(2, '720p')">720p</button>
            <button class="quality-btn" onclick="selectQuality(2, '480p')">480p</button>
        </div>
    </div>

    <!-- Episode 3 (Coming Soon) -->
    <div class="episode-card" style="opacity: 0.5;">
        <div class="ep-details">
            <h4>Episode 3 <span style="font-size: 10px; background: #d32f2f; color: white; padding: 2px 5px; border-radius: 3px;">SOON</span></h4>
            <p>Releasing soon...</p>
        </div>
        <div class="btn-group">
            <span style="font-size: 14px; color: #888;">🔒 Locked</span>
        </div>
    </div>

    <script>
        // Telegram WebApp Initialize
        window.Telegram.WebApp.ready();

        function selectQuality(episodeNum, qualityStr) {
            // Data jo bot ke pas jayega
            const payload = JSON.stringify({
                episode: episodeNum,
                quality: qualityStr
            });

            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.sendData(payload); // Bot ko data bhejna
            } else {
                alert("Please open inside Telegram!");
            }
        }
    </script>

</body>
</html>
